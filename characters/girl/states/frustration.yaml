---
name: Frustration
description: being annoyed by being hindered by circumstances or people
examples:
  major_decrease: major success to a personal goal
  minor_decrease: getting recognition, getting closer to personal goal
  minor_increase: being ignored, being stuck trying to achieve personal goal
  major_increase: goal getting out of reach, other people actively interfering with your actions
base: 0
change:
  default: 0
  move: -15
  sleep: -25
  context: [-40, -6, +2, +6]
intervals:
  - values: [80, 100]
    effect: 'You are really annoyed and frustrated. You should take more extreme measures to achieve your goals!'
events:
  - above: 70
    hint: '%selfname% roll their eyes seeming quite frustrated.'
