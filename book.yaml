title: Electric City
description: |-
  After a long journey through the Static Plains you finally arrive at Electric City. What sounds like a glorious buzzing metropolis, turns out to be just another aging hub like all the others scattered throughout the plains. Well, at least its buzzing. Who are the people still living in such a god-forsaken place?

  In this cyberpunk-style book you can visit Electric City's most electrifying places and chat with its eerie residents, getting to know the people who are still there.
