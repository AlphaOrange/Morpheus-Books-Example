description_detailed: >-
  Zo's Bar is a cozy place with an electric vibe. Lots of neon lights and metallic surfaces give it a modern feel.
  The bar is stocked with a variety of spirits in fancy bottles, especially the local specialty, Electric Whiskey.
  The music playing in the background is a mix of electronic and jazz.
  There is a long bar counter with stools, and a few tables at the large window that looks out onto the empty streets of Electric City.
  It's clean and well-maintained.
  There is a front door and a door in the back that leads to the restrooms.
  There are a few patrons sitting at the bar and tables, enjoying their drinks and chatting.
